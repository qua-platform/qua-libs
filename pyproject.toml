[project]
name = "qm-eval"
version = "0.1.0"
description = "Combined development environment for quam-builder and qua-libs calibration graphs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cma>=4.4.4",
    "qualibrate==1.2.1",
    "quam-builder",
    "quantum-dots-calibrations",
    "virtual-qpu @ git+https://github.com/qua-platform/virtual_qpu.git; python_version >= '3.11'",
]

[tool.uv]
prerelease = "allow"
override-dependencies = ["numpy>=2.0.0", "jax<0.10"]

[tool.uv.workspace]
members = ["quam-builder", "qualibration_graphs/quantum_dots"]

[tool.uv.sources]
quam-builder = { workspace = true }
quantum-dots-calibrations = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.0.0a1",
    "nbconvert",
    "pre-commit",
    "pylint>=3.0",
    "astroid>=3.0",
    "pytest>=8.3.5",
    "pytest-cov",
    "pytest-mock>=3.14.0",
    "pyserial>=3.5",
    "numpyro>=0.15.0",
    "qarray>=1.6.0",
    "ruff",
    "mypy",
    "black",
]
ast = [
    "qua-qsim@git+https://github.com/qua-platform/qua-qsim.git@bare-ast-visitor",
]

[project.optional-dependencies]
bayesian = [
    "numpyro>=0.15.0",
]
visa = [
    "pyvisa-py>=0.7.0",
]
